          var mapExtent = [0, 0, 50000, 50000];
          var mapMinZoom = 1;
          var mapMaxZoom = 7;
          var mapMaxResolution = 2.00000000;
          var mapMinResolution = Math.pow(2, mapMaxZoom) * mapMaxResolution;
          var tileExtent = [0.00000000, 0, 50000, 50000];
          var crs = L.CRS.Simple;
          crs.transformation = new L.Transformation(1, -tileExtent[0], -1, tileExtent[3]);
          crs.scale = function(zoom) {
            return Math.pow(2, zoom) / mapMinResolution;
          };
          var bounds = [[0,0], [50000,50000]];
          crs.zoom = function(scale) {
            return Math.log(scale * mapMinResolution) / Math.LN2;
          };
          var layer;

            });

                  .show([1,1])
          // --- MAP-BEWEGUNG & ZOOM DEAKTIVIEREN ---
          map.scrollWheelZoom.disable();
          map.dragging.disable();
          map.doubleClickZoom.disable();
          map.touchZoom.disable();
          map.boxZoom.disable();
          map.keyboard.disable();

          // --- SCROLLBLOCKER FÜR FIREFOX ---
          const scrollBlocker = (e) => {
            // Scroll zulassen, wenn im Fenster selbst
            if (e.target.closest('.content-inner')) return;
            e.preventDefault();
          };
          window.addEventListener('wheel', scrollBlocker, { passive: false });

          // --- ESC zum Schließen ---
          const escCloseHandler = (e) => {
            if (e.key === "Escape") win.hide();
          };
          document.addEventListener("keydown", escCloseHandler);

          // --- WENN FENSTER GESCHLOSSEN WIRD ---
          win.on('hide', function () {
            map.scrollWheelZoom.enable();
            map.dragging.enable();
            map.doubleClickZoom.enable();
            map.touchZoom.enable();
            map.boxZoom.enable();
            map.keyboard.enable();
            window.removeEventListener('wheel', scrollBlocker);
            document.removeEventListener("keydown", escCloseHandler);
          });
        })
        .bindTooltip('<span class="label ' + feature.properties.Class + '">'+ feature.properties.Label + '</span>',

            permanent: true, 
            direction: 'center',
            interactive: true

activateUnkownLocations.addEventListener("change", updateUnknownLayer);

function updateUnknownLayer() {
    const z = map.getZoom();
    const enabled = activateUnkownLocations.checked === false;

    // --- TINY ab Zoom 4 ---
    if (enabled && z >= 6) {
        if (!map.hasLayer(geojsonUnkownTiny)) {
            map.addLayer(geojsonUnkownTiny);
        }
    } else {
        if (map.hasLayer(geojsonUnkownTiny)) {
            map.removeLayer(geojsonUnkownTiny);
        }
    }

    // --- FULL ab Zoom 5 ---
    if (enabled && z >= 5) {
        if (!map.hasLayer(geojsonUnkown)) {
            map.addLayer(geojsonUnkown);
        }
    } else {
        if (map.hasLayer(geojsonUnkown)) {
            map.removeLayer(geojsonUnkown);
        }
    }
}

      function updatePrevButton() {
        const hasHistory = window.history.length > 1;
        const hasReferrer = document.referrer && !document.referrer.startsWith(window.location.href);

        // Wenn keine History oder kein Referrer → Button ausblenden
        if (!hasHistory || document.referrer === "" || document.referrer === window.location.href) {
          prevButton.style.display = 'none';
          return;
        }

        prevButton.style.display = 'flex';
      }

      // Beim Laden prüfen
      window.addEventListener('DOMContentLoaded', updatePrevButton);

      // Bei Navigation (zurück/vorwärts)
      window.addEventListener('popstate', updatePrevButton);

      // Bei SPA-artiger Navigation
      const originalPushState = history.pushState;
      const originalReplaceState = history.replaceState;

      history.pushState = function (...args) {
        originalPushState.apply(this, args);
        updatePrevButton();
      };

      history.replaceState = function (...args) {
        originalReplaceState.apply(this, args);
        updatePrevButton();
      };

      // Klick-Event: zurück navigieren
      prevButton.addEventListener('click', () => {
        window.history.back();
      });
